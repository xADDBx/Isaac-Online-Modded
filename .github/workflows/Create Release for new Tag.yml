name: Create Release for new Tag

on:
  push:
    tags:        
      - '**'

jobs:

  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ./IsaacOnlineModded/IsaacOnlineModded.csproj

      - name: Publish Windows
        run: dotnet publish ./IsaacOnlineModded/IsaacOnlineModded.csproj /p:PublishProfile=Windows

      - name: Publish Linux
        run: |
          dotnet publish ./IsaacOnlineModded/IsaacOnlineModded.csproj /p:PublishProfile=Linux
          Copy-Item ./IsaacOnlineModded/Binaries/Linux/IsaacOnlineModded ./IsaacOnlineModded-Linux

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "IsaacOnlineModded/Binaries/Windows/IsaacOnlineModded.exe,IsaacOnlineModded-Linux"
          name: IsaacOnlineModded Patcher Release ${{ github.ref_name }}
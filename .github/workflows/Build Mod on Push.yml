name: Build Mod on Push

on:
  push:

jobs:

  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ./IsaacOnlineModded/IsaacOnlineModded.csproj

      - name: Publish Windows
        run: dotnet publish ./IsaacOnlineModded/IsaacOnlineModded.csproj /p:PublishProfile=Windows

      - name: Publish Linux
        run: |
          dotnet publish ./IsaacOnlineModded/IsaacOnlineModded.csproj /p:PublishProfile=Linux
          Copy-Item ./IsaacOnlineModded/Binaries/Linux/IsaacOnlineModded ./IsaacOnlineModded-Linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: IsaacOnlineModded
          path: |
            ./IsaacOnlineModded/Binaries/Windows/IsaacOnlineModded.exe
            ./IsaacOnlineModded-Linux